# Verifica todo push y, si es a `main`, despliega en Coolify.
#
# El build de las imagenes lo hace Coolify en el VPS (clona el repo con una deploy
# key). Este workflow es el que decide SI se despliega: si el typecheck, los tests o
# el build fallan, el deploy no se dispara.
#
# Secretos del repo (Settings -> Secrets and variables -> Actions):
#   COOLIFY_URL, COOLIFY_TOKEN, COOLIFY_APP_WEB_UUID, COOLIFY_APP_MCP_UUID
# Variables:
#   URL_WEB_PUBLICA, URL_MCP_PUBLICA
name: ci y deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-y-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: typecheck, tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: catalogo.json al dia
        run: |
          pnpm catalogo
          git diff --exit-code packages/catalogo/catalogo.json \
            || { echo "::error::catalogo.json esta desfasado de los schemas: corre 'pnpm catalogo' y commitea"; exit 1; }

      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @maya/web build

      # `scripts/humo.sh` NO corre aqui a proposito. Desde el ADR 0010 el MCP necesita
      # la base para arrancar, y el humo aplica una accion: correrlo en cada push
      # escribiria en la base de la demo y podria ensuciar un ensayo en curso. Lo que
      # cubre ese hueco: las 288 pruebas (que usan el volcado, sin red) y el paso de
      # abajo, que pregunta a la URL publica y exige mensajes A2UI de vuelta.

  desplegar:
    name: deploy a Coolify
    needs: verificar
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.URL_WEB_PUBLICA }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Historia completa: el paso del prompt real compara contra el commit anterior al push.
          fetch-depth: 0

      - name: disparar el deploy y esperar los /health
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_WEB_UUID: ${{ secrets.COOLIFY_APP_WEB_UUID }}
          COOLIFY_APP_MCP_UUID: ${{ secrets.COOLIFY_APP_MCP_UUID }}
          URL_WEB_PUBLICA: ${{ vars.URL_WEB_PUBLICA }}
          URL_MCP_PUBLICA: ${{ vars.URL_MCP_PUBLICA }}
        run: scripts/deploy.sh

      # Un prompt real contra lo publicado. Distingue tres desenlaces, porque "no salio
      # una pantalla" tiene dos causas muy distintas y antes las trataba igual:
      #
      #   1. salen mensajes A2UI            -> pasa: el agente publicado construye UI;
      #   2. el stream dice `codigo: modelo`-> AVISA y sigue: la app llego al proveedor y
      #      reporto el fallo con honestidad. Si el proyecto se quedo sin cuota o el
      #      proveedor esta caido, eso NO es un deploy roto y no puede bloquear el resto;
      #   3. cualquier otra cosa            -> falla: sin `fin` el contrato del stream se
      #      rompio, y sin A2UI ni error de modelo el problema es nuestro.
      #
      # El 2026-09-12 el tope de gasto de Gemini (50 MXN al mes, issue #12) dejo este paso
      # en rojo en cada push: el deploy se publicaba igual y el rojo tapaba si algo mas se
      # rompia. Un CI que no sabe distinguir lo externo de lo propio deja de servir.
      #
      # Y solo corre si algo de lo que este paso prueba cambio desde el ultimo commit en que
      # PASO. Un turno real son ~55k tokens de entrada, y con el commit automatico de cada
      # turno de cuatro personas hubo 96 corridas del CI el 2026-09-12, casi todas de bitacora.
      # Se compara contra la etiqueta `prompt-verificado` y no contra el push anterior: con
      # `cancel-in-progress`, un push de docs encima de uno del agente cancela la corrida del
      # agente, y comparando contra el anterior el prompt no se corria nunca (paso el 13 con
      # 7779049). Sin etiqueta, o con `workflow_dispatch`, corre siempre.
      - name: un prompt del guion contra la URL publica
        if: vars.URL_WEB_PUBLICA != ''
        env:
          URL_WEB_PUBLICA: ${{ vars.URL_WEB_PUBLICA }}
        run: |
          git fetch -q --force origin 'refs/tags/prompt-verificado:refs/tags/prompt-verificado' 2>/dev/null || true
          verificado=$(git rev-parse -q --verify 'refs/tags/prompt-verificado^{commit}' 2>/dev/null || true)
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ -n "$verificado" ]; then
            if ! git diff --name-only "$verificado" "$GITHUB_SHA" \
                | grep -qE '^(apps/web/src/lib/agente/|apps/web/src/app/api/agente/|packages/(catalogo|a2ui|schemas)/|apps/mcp/src/)'; then
              echo "nada del agente, el catalogo, el motor A2UI ni el MCP cambio desde ${verificado:0:7} (ultimo prompt real que paso): se omite (~55k tokens de entrada)"
              exit 0
            fi
          fi

          respuesta=$(curl -fsS --max-time 40 -X POST "$URL_WEB_PUBLICA/api/agente" \
            -H 'content-type: application/json' \
            -d '{"usuarioId":"usr_beto","conversacionId":"c_ci","mensajes":[{"rol":"usuario","texto":"Quiero pagar menos intereses de mi tarjeta"}]}') || {
            echo "::error::la URL publica no contesto el POST /api/agente"
            exit 1
          }
          echo "$respuesta" | head -8

          # El contrato dice que el stream SIEMPRE termina en `fin`, pase lo que pase.
          # Si eso no se cumple, es un bug nuestro sin importar lo demas.
          echo "$respuesta" | grep -q '"tipo":"fin"' || {
            echo "::error::el stream no termino en \`fin\`: el contrato agente-cliente esta roto"
            exit 1
          }

          if echo "$respuesta" | grep -q '"tipo":"a2ui"'; then
            componentes=$(echo "$respuesta" | grep -o '"component":"[^"]*"' | sort -u | tr '\n' ' ')
            echo "el agente publicado construyo una pantalla: $componentes"
            # Este commit queda como el ultimo verificado. Si no se puede mover, el siguiente
            # push vuelve a correr el prompt: es el lado seguro.
            git tag -f prompt-verificado "$GITHUB_SHA" >/dev/null
            git push -q -f origin refs/tags/prompt-verificado || echo "::warning::no se pudo mover la etiqueta prompt-verificado"
            exit 0
          fi

          if echo "$respuesta" | grep -q '"codigo":"modelo"'; then
            motivo=$(echo "$respuesta" | sed -n 's/.*"codigo":"modelo","mensaje":"\([^"]*\)".*/\1/p' | head -1 | cut -c -300)
            echo "::warning title=El agente publicado no tiene modelo::La app respondio y reporto el fallo, asi que el deploy esta bien; lo que falta es cuota o disponibilidad del proveedor. Motivo: $motivo"
            echo "OJO: el agente publicado NO esta construyendo pantallas. Revisa el issue #12."
            exit 0
          fi

          echo "::error::la URL publica no devolvio mensajes A2UI ni un error de modelo: el problema es nuestro"
          exit 1
