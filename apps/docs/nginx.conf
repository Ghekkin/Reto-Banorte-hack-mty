# nginx de @maya/docs: sirve el `dist/` estatico de Astro. HTTPS y dominio los pone
# Traefik (Coolify) delante; aqui solo se escucha en 80 dentro del contenedor.
server {
  listen 80;
  listen [::]:80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # `/ruta` → `/ruta/` con Location relativo: nginx no sabe que afuera es https.
  absolute_redirect off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Starlight genera `ruta/index.html`; `$uri.html` cubre las paginas sueltas.
  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  # Los assets de `_astro/` llevan hash en el nombre: se pueden cachear para siempre.
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  error_page 404 /404.html;

  # Healthcheck del contenedor y de Coolify.
  location = /salud {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }
}
